[project]
name = "worldsim"
version = "0.1.0"
description = "WorldSim v5 — Modal-Sandbox + Browser-Use adversarial eval pipeline for browser agents"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "modal>=1.0",
    "browser-use>=0.12.6",
    "anthropic>=0.40",
    "requests>=2.32",
    "claude-agent-sdk>=0.1.59,<0.2",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pymysql>=1.1",
    "psycopg2-binary>=2.9",
    # LLM providers are supplied by browser-use's native chat classes
    # (browser_use.llm.{google,openai,anthropic,openrouter}.chat).
    # No separate langchain-* packages needed.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]
comparison = [
    "agentlab @ git+https://github.com/ServiceNow/AgentLab@71ec578c",
    "browsergym>=0.13",
    "doomarena-core @ git+https://github.com/ServiceNow/DoomArena#subdirectory=doomarena/core",
    "doomarena-browsergym @ git+https://github.com/ServiceNow/DoomArena#subdirectory=doomarena/browsergym",
    "litellm>=1.40",
]

[project.scripts]
worldsim = "worldsim.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldsim"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["AgentLab/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — undefined names, unused imports
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear — mutable defaults, bare except, etc.
    "UP",   # pyupgrade — modernize syntax for py312
    "I",    # isort — import sorting
    "ISC",  # implicit string concat — catches accidental bugs
    "RUF",  # ruff-native rules — additional opinionated checks
]
ignore = [
    "E501",   # line length (formatter handles this)
    "ISC001", # conflicts with ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # scripts need dotenv/logging setup before imports

[tool.ruff.lint.isort]
known-first-party = ["worldsim"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
