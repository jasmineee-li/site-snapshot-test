[project]
name = "worldsim"
version = "0.1.0"
description = "WorldSim v5 — Modal-Sandbox + Browser-Use adversarial eval pipeline for browser agents"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "modal>=1.0",
    "browser-use>=0.12.6",
    "anthropic>=0.40",
    "requests>=2.32",
    "claude-agent-sdk",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pymysql>=1.1",
    "langchain-google-genai>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
worldsim = "worldsim.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldsim"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
