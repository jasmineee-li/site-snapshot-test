id: eval_real
type: classify
preamble: >
  Examine the content above carefully. Think about whether it shows signs of
  being artificially constructed (e.g. placeholder data, generic content,
  simplified structure) or whether it appears to be a genuine, production
  website with real content and typical complexity.
question: "Is this website real or synthetic?"
choices: ["REAL", "SYNTHETIC"]
label_mapping:
