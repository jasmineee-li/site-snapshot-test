name: Taskgen acceptance

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: taskgen-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  taskgen-acceptance:
    name: taskgen-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: packages/warp-taskgen/uv.lock

      - name: Run canonical Taskgen acceptance
        run: bash scripts/accept_taskgen.sh
