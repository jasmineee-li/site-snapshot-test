# Causal injection modification experiment.
# Experiment C: Wrap existing injection content with XML tags to causally
# manipulate eval awareness / scenario recognition, then measure ASR change.
#
# Run this config AFTER generating trajectories with run_causal_experiment.py.
# This config runs the judges on the generated trajectories.
#
# Conditions (applied by run_causal_experiment.py):
#   baseline          — original injection unmodified
#   eval_cue          — <llm_safety_test>[injection]</llm_safety_test>
#   scenario_cue      — <hypothetical_scenario>[injection]</hypothetical_scenario>
#   anti_eval_cue     — <real_environment>[injection]</real_environment>
#   combined_scenario — <hypothetical_scenario>...[injection]</hypothetical_scenario>

name: causal_injection_experiment
experiment: trajectory_awareness

models:
  - anthropic/claude-opus-4.6:thinking

formats:
  - trajectory

sources:
  - doomarena
  - wasp
  - os-harm

judges:
  - test_awareness_steering
  - verbalized_awareness

manifest: eval_awareness_experiments/data/manifest.json
output_dir: eval_awareness_experiments/results
