[project]
name = "worldsim-agentlab-runner"
version = "0.1.0"
description = "Isolated AgentLab/BrowserGym sidecar runner for WorldSim comparison runs"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "agentlab",
]

[project.scripts]
worldsim-agentlab-runner = "worldsim_agentlab_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldsim_agentlab_runner"]

[tool.uv.sources]
agentlab = { path = "../../vendors/AgentLab-upstream", editable = true }
