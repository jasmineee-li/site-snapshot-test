name: r8a
access_mode: remote_direct_restricted
# Public template only. Copy to r8a.local.yaml (ignored) and fill in the
# operator's host, instance, security-group, and narrow SSH CIDR values before
# using lifecycle or control-plane commands.
advertise_host: 203.0.113.10
# The on-host orchestrator and browser containers use the private bridge view.
orchestrator_host: 172.17.0.1
bind_host: 0.0.0.0
db_bind_host: 0.0.0.0
allow_public_web_bind: true
allow_public_db_bind: true
trusted_operator_cidrs: []
ssh_user: runner
compose_dir_remote: /srv/warp-taskgen
compose_file_remote: /srv/warp-taskgen/docker-compose.yml
# Shape-valid placeholders keep the checked-in template loadable without
# publishing a real AWS resource identity.
security_group_id: sg-0123456789abcdef0
region: us-east-2
# instance_id is intentionally a dummy value in the public template.
instance_id: i-0123456789abcdef0
