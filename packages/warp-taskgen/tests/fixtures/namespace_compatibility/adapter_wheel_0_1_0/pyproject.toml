[project]
name = "warp-taskgen"
version = "0.1.0"
description = "Secret-free adapter-bearing wheel fixture for the namespace upgrade proof"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
warp-taskgen = "warp_taskgen.main:main"
worldsim = "warp_taskgen.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warp_taskgen", "worldsim"]
